name: Test & Publish Next

on:
  push:
    branches:
      - main

concurrency:
  group: test-build-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-and-tag:
    uses: ./.github/workflows/npm-publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      version-source: dunamai
      publish-tag: next
